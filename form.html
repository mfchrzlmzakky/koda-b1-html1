<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Perokok Berat</title>
  </head>
  <body>
    <form action="#" method="post">
      <label for="name">Siapa nama anda?</label>
      <br />
      <input type="text" id="1" name="name" />
      <br />
      <label for="age">Berapa umur anda?</label>
      <br />
      <input type="text" id="2" name="age" />
      <br />
      <label for="">Apa jenis kelamin anda?</label>
      <br />
      <input type="radio" id="3" name="gender" value="Laki-laki" />
      <label for="man">Laki-Laki</label>
      <input type="radio" id="4" name="gender" value="Permepuan" />
      <label for="woman">Perempuan</label>
      <br />
      <label for="">Apakah anda perokok?</label>
      <br />
      <input type="radio" name="smoke" id="ya" />
      <label for="ya">Ya</label>
      <input type="radio" name="smoke" id="tidak" />
      <label for="tidak">Tidak</label>
      <br />
      <label for="">Jika anda perokok, rokok apa yang anda pernah coba?</label>
      <br />
      <input type="checkbox" name="gudangGaram" id="gudangGaram" />
      <label for="gudangGaram">Gudang Garam Filter</label>
      <br />
      <input type="checkbox" name="luckyStrike" id="luckyStrike" />
      <label for="luckyStrike">Lucky Strike</label>
      <br />
      <input type="checkbox" name="marlboro" id="marlboro" />
      <label for="marlboro">Marlboro</label>
      <br />
      <input type="checkbox" name="esse" id="esse" />
      <label for="esse">Esse</label>
      <br />
      <button type="submit">Submit</button>
    </form>
    <br />
    <p><a href="hasilForm.html">Hasil Survey</a></p>
    <p><a href="index.html">Kembali</a></p>
  </body>
</html>
